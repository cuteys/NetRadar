name: Release & Docker Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 Tag (例如 v0, v0.1.0)'
        required: false
        default: 'v0'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Release version: ${VERSION}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build
          cd ..

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Cross-Compile Binaries
        run: |
          mkdir -p bin dist_release
          LDFLAGS="-s -w -X main.Version=${VERSION}"

          # -------------------------------------------------------------
          # 1. 编译 NetRadar 控制端
          # -------------------------------------------------------------
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/netradar ./server
          tar -czf dist_release/netradar_${VERSION}_linux_amd64.tar.gz -C bin netradar
          cp bin/netradar dist_release/netradar-linux-amd64

          # Linux ARM64 (aarch64 服务器及树莓派/新软路由)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/netradar ./server
          tar -czf dist_release/netradar_${VERSION}_linux_arm64.tar.gz -C bin netradar
          cp bin/netradar dist_release/netradar-linux-arm64

          # Linux ARMv7 (32位 ARM 设备)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="${LDFLAGS}" -o bin/netradar ./server
          tar -czf dist_release/netradar_${VERSION}_linux_armv7.tar.gz -C bin netradar
          cp bin/netradar dist_release/netradar-linux-armv7

          # macOS (Intel & Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/netradar ./server
          tar -czf dist_release/netradar_${VERSION}_darwin_amd64.tar.gz -C bin netradar
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/netradar ./server
          tar -czf dist_release/netradar_${VERSION}_darwin_arm64.tar.gz -C bin netradar

          # -------------------------------------------------------------
          # 2. 编译 NetRadar 边缘探针
          # -------------------------------------------------------------
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_linux_amd64.tar.gz -C bin agent
          cp bin/agent dist_release/agent-linux-amd64

          # Linux ARM64 (主流家用 OpenWrt 路由器，如小米 AX6000 / AX9000 等)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_linux_arm64.tar.gz -C bin agent
          cp bin/agent dist_release/agent-linux-arm64

          # Linux ARMv7
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_linux_armv7.tar.gz -C bin agent
          cp bin/agent dist_release/agent-linux-armv7

          # Linux MIPSLE / MIPS (软浮点，专为老款联发科 MT7621 小米/红米等 OpenWrt 路由器定制)
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_linux_mipsle.tar.gz -C bin agent
          cp bin/agent dist_release/agent-linux-mipsle

          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_linux_mips.tar.gz -C bin agent
          cp bin/agent dist_release/agent-linux-mips

          # macOS (Intel & Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_darwin_amd64.tar.gz -C bin agent
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o bin/agent ./agent
          tar -czf dist_release/agent_${VERSION}_darwin_arm64.tar.gz -C bin agent

          # 生成 SHA256 校验和文件
          cd dist_release
          sha256sum * > sha256sums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: NetRadar ${{ env.VERSION }}
          files: dist_release/*
          generate_release_notes: true
          draft: false
          prerelease: false

  docker-release:
    name: Build & Push Server Docker Image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker Tags
        id: tags
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          SERVER_TAGS="ghcr.io/${OWNER_LC}/netradar:${VERSION},ghcr.io/${OWNER_LC}/netradar:latest"

          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            DH_USER=$(echo "${DOCKERHUB_USERNAME}" | tr '[:upper:]' '[:lower:]')
            SERVER_TAGS="${SERVER_TAGS},${DH_USER}/netradar:${VERSION},${DH_USER}/netradar:latest"
          fi

          echo "server_tags=${SERVER_TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.server_tags }}
